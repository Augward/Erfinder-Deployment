<script>
    var map;
    var USER_LOCATION = null;
    var FACILITIES_CACHE = [];

    document.addEventListener("DOMContentLoaded", function() {
        // Initialize Map
        map = L.map('map').setView([41.6611, -91.5302], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Geolocation Logic
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude, longitude } = pos.coords;
                USER_LOCATION = { lat: latitude, lon: longitude };
                map.setView([latitude, longitude], 13);
                L.marker([latitude, longitude]).addTo(map).bindPopup("Your Location").openPopup();
            });
        }

        // Facility Marker Logic
        fetch('/api/facilities')
            .then(res => res.json())
            .then(data => {
                FACILITIES_CACHE = data;
                data.forEach(fac => {
                    L.marker([fac.lat, fac.lon]).addTo(map)
                        .bindPopup(`<b>${fac.name}</b><br>Wait Time: ${fac.wait} mins<br>Beds: ${fac.beds}`);
                });
            });
    });

    // Haversine Calculation Helper
    function distanceKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;

        const a =
            Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) *
            Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;

        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
</script>


<script>
    function recommendERs() {
        if (!USER_LOCATION || FACILITIES_CACHE.length === 0) return;

        let bestFacility = null;
        let bestDistance = Infinity;

        FACILITIES_CACHE.forEach(f => {
            const lat = Number(f.lat);
            const lon = Number(f.lon);
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

            const d = distanceKm(
                USER_LOCATION.lat,
                USER_LOCATION.lon,
                lat,
                lon
            );

            if (d < bestDistance) {
                bestDistance = d;
                bestFacility = f;
            }
        });

        if (bestFacility) {
            alert(`We recommend: ${bestFacility.name} (Distance: ${bestDistance.toFixed(2)} km)`);
        }
    }
</script>
