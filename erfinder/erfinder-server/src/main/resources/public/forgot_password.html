<!-- "Standards Mode". Replacing this declaration   -->

<html>
<head>
    <meta charset=UTF-8>

    <!--                                                               -->
    <!-- Consider inlining CSS to reduce the number of requested files -->
    <!--                                                               -->
    <link type="text/css" rel="stylesheet" href="erfinder.css">

    <!--                                           -->
    <!-- Any title is fine                         -->
    <!--                                           -->
    <title>Web Application Starter Project</title>

    <!--                                           -->
    <!-- This script loads your compiled module.   -->
    <!-- If you add any GWT meta tags, they must   -->
    <!-- be added before this line.                -->
    <!--                                           -->
</head>

<!--                                           -->

<body>
<p id="page">Forgot</p>

<!-- RECOMMENDED if your web app will not function without JavaScript enabled -->
<noscript>
    <div style="width: 22em; position: absolute; left: 50%; margin-left: -11em; color: red; background-color: white; border: 1px solid red; padding: 4px; font-family: sans-serif">
        Your web browser must have JavaScript enabled
        in order for this application to display correctly.
    </div>
</noscript>

<h1>Forgot Password?</h1>

<table align="center">
    <tr>
        <td colspan="3" style="font-weight:bold;">Enter UserID:</td>
    </tr>
    <tr>
        <td colspan="2" id="userIDContainer"></td>
        <td id="submitID"></td>
    </tr>
    <tr>
        <td colspan="3" id="questionContainer"></td>
    </tr>
    <tr>
        <td colspan="2" id="answerContainer"></td>
        <td id="submitAnswer"></td>
    </tr>
    <tr>
        <td colspan="3" style="color:red;" id="responseContainer"></td>
    </tr>
    <tr>
        <td colspan="2" style="color:red;"><a href="login.html">Return to Log In</a></td>
    </tr>
</table>
</body>
<!-- I'm putting this here so it loads last! :) -->
<script src="app/app.nocache.js"></script>
</html>
