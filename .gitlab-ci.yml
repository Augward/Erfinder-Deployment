image: maven:3.9-eclipse-temurin-17

stages:
  - test
  - sonarqube

test:
  stage: test
  script:
    - cd erfinder
    - mvn clean test

  artifacts:
    paths:
      - erfinder/**/target/
    expire_in: 1 hour

sonarqube:
  stage: sonarqube
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - cd erfinder
    - mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true
  allow_failure: false